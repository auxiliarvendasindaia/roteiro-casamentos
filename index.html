<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0a'/%3E%3Cpath d='M9 24V8h3v16zm6 0V8h3l5 10V8h3v16h-3l-5-10v10z' fill='%23c8a43a'/%3E%3C/svg%3E">
<title>Roteiro Indaiá Casamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'PP Editorial New'; src: url('fonts/PPEditorialNew-Ultralight-BF644b21500d0c0.otf') format('opentype'); font-weight: 200; font-style: normal; font-display: swap; }
  @font-face { font-family: 'PP Editorial New'; src: url('fonts/PPEditorialNew-UltralightItalic-BF644b214ff1e9b.otf') format('opentype'); font-weight: 200; font-style: italic; font-display: swap; }
  @font-face { font-family: 'PP Editorial New'; src: url('fonts/PPEditorialNew-Regular-BF644b214ff145f.otf') format('opentype'); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: 'PP Editorial New'; src: url('fonts/PPEditorialNew-Italic-BF644b214fb0c0a.otf') format('opentype'); font-weight: 400; font-style: italic; font-display: swap; }
  @font-face { font-family: 'PP Editorial New'; src: url('fonts/PPEditorialNew-Ultrabold-BF644b21500840c.otf') format('opentype'); font-weight: 800; font-style: normal; font-display: swap; }
  @font-face { font-family: 'PP Editorial New'; src: url('fonts/PPEditorialNew-UltraboldItalic-BF644b214faef01.otf') format('opentype'); font-weight: 800; font-style: italic; font-display: swap; }

  :root {
    --bg: #050505;
    --painel: #0d0d0d;
    --linha: rgba(255,255,255,0.10);
    --texto: rgba(255,255,255,0.88);
    --suave: rgba(255,255,255,0.45);
    --ouro: #c8a43a;
    --ouro-claro: #f0d060;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--texto); font-family: 'Montserrat', system-ui, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }

  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--linha); flex-shrink: 0;
  }
  .titulo { font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--ouro); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contador { font-size: 11px; color: var(--suave); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .contador b { color: var(--texto); font-weight: 600; }
  .espaco { flex: 1; }
  .botoes { display: flex; gap: 6px; }
  .bt {
    border: 1px solid var(--linha); background: transparent; border-radius: 6px;
    padding: 6px 12px; font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--suave);
  }
  .bt:hover { color: var(--texto); border-color: rgba(255,255,255,0.25); }
  .bt.ativo { background: #b45309; border-color: #b45309; color: #fff; }

  main { flex: 1; display: flex; min-height: 0; }
  #palco { flex: 1; position: relative; min-width: 0; overflow: hidden; touch-action: pan-y; }
  #canvas { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; overflow: hidden; transform-origin: center center; }

  #notas {
    width: 384px; flex-shrink: 0; border-left: 1px solid var(--linha); background: rgba(0,0,0,0.95);
    display: none; flex-direction: column; min-height: 0;
  }
  body.com-notas #notas { display: flex; }
  .notas-abas { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--linha); }
  .notas-aba { border: 0; background: transparent; border-radius: 4px; padding: 4px 10px; font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--suave); }
  .notas-aba.ativo { background: #d97706; color: #fff; }
  .notas-fechar { border: 0; background: transparent; color: var(--suave); font-size: 16px; line-height: 1; padding: 4px; }
  .notas-slide { padding: 8px 16px 0; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.3); }
  #notas-texto { flex: 1; overflow-y: auto; padding: 14px 20px 24px; font-size: 14px; line-height: 1.65; white-space: pre-wrap; }
  #notas-texto.vazio { font-size: 12px; color: rgba(255,255,255,0.3); }

  footer {
    display: flex; align-items: center; justify-content: center; gap: 16px; padding: 10px 16px;
    border-top: 1px solid var(--linha); flex-shrink: 0;
  }
  .nav { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--linha); background: transparent; font-size: 18px; }
  .nav:disabled { opacity: 0.25; cursor: default; }
  .nome-slide { min-width: 0; max-width: 60vw; text-align: center; font-size: 12px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .atalhos { position: absolute; right: 16px; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.2); }

  /* Grade de slides */
  #grade { position: fixed; inset: 0; z-index: 80; background: var(--bg); display: none; flex-direction: column; }
  #grade.aberta { display: flex; }
  .grade-topo { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--linha); }
  .grade-lista { flex: 1; overflow-y: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; align-content: start; grid-auto-rows: max-content; }
  .miniatura { display: flex; flex-direction: column; border: 1px solid var(--linha); border-radius: 6px; background: transparent; padding: 0; text-align: left; overflow: hidden; }
  .miniatura.atual { border-color: var(--ouro); }
  .miniatura .quadro { flex-shrink: 0; position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #0a0a0a; }
  .miniatura .quadro > div { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; pointer-events: none; }
  .miniatura .legenda { display: block; padding: 8px 10px; font-size: 11px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .miniatura .legenda b { color: var(--texto); margin-right: 6px; }

  /* Blocos do slide (espelham o BlocoRenderer do CRM) */
  .bloco { position: absolute; transition: opacity 0.6s ease-out, transform 0.6s ease-out; }
  .bloco.oculto { opacity: 0; transform: translateY(16px); }
  .bloco a { color: inherit; }
  .rodar {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.35); z-index: 6; border: 0; padding: 0;
  }
  .rodar span {
    display: flex; align-items: center; gap: 14px; padding: 18px 44px; border-radius: 14px;
    color: #000; font-weight: 900; font-size: 22px; letter-spacing: 3px;
    background: linear-gradient(135deg, #c8a43a 0%, #f0d060 40%, #c8a43a 70%, #a07828 100%);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }

  #carregando { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; letter-spacing: 3px; color: rgba(255,255,255,0.3); }

  @media (max-width: 820px) {
    main { flex-direction: column; }
    #palco { flex: 0 0 auto; height: 56.25vw; max-height: 60vh; }
    #notas { width: auto; border-left: 0; border-top: 1px solid var(--linha); flex: 1; }
    body:not(.com-notas) #palco { flex: 1; height: auto; max-height: none; }
    .atalhos { display: none; }
    .titulo { display: none; }
    header { padding: 8px 16px; }
    .bt { padding: 6px 9px; letter-spacing: 1px; }
  }
</style>
</head>
<body class="com-notas">
<header>
  <span class="titulo" id="titulo">Roteiro</span>
  <span class="contador" id="contador"></span>
  <span class="espaco"></span>
  <div class="botoes">
    <button class="bt" id="bt-grade" title="Ver todos os slides (G)">SLIDES</button>
    <button class="bt ativo" id="bt-dicas" title="Dicas do consultor (D)">DICAS</button>
    <button class="bt" id="bt-exemplo" title="Exemplo de fala (E)">EXEMPLO</button>
  </div>
</header>

<main>
  <div id="palco">
    <div id="carregando">CARREGANDO ROTEIRO...</div>
    <div id="canvas"></div>
  </div>
  <aside id="notas" aria-label="Notas do consultor">
    <div class="notas-abas">
      <button class="notas-aba ativo" data-aba="dicas">DICAS</button>
      <button class="notas-aba" data-aba="exemplo">EXEMPLO</button>
      <span class="espaco"></span>
      <button class="notas-fechar" id="notas-fechar" title="Fechar (Esc)">✕</button>
    </div>
    <p class="notas-slide" id="notas-slide"></p>
    <div id="notas-texto"></div>
  </aside>
</main>

<footer>
  <button class="nav" id="anterior" title="Anterior (←)">‹</button>
  <span class="nome-slide" id="nome-slide"></span>
  <button class="nav" id="proximo" title="Próximo (→ ou espaço)">›</button>
  <span class="atalhos">Setas navegam · D dicas · E exemplo · G slides · F tela cheia</span>
</footer>

<div id="grade" role="dialog" aria-label="Todos os slides">
  <div class="grade-topo">
    <span class="titulo">Todos os slides</span>
    <span class="espaco"></span>
    <button class="notas-fechar" id="grade-fechar" title="Fechar (Esc)">✕</button>
  </div>
  <div class="grade-lista" id="grade-lista"></div>
</div>

<script>
(() => {
  const W = 1280, H = 720;
  const params = new URLSearchParams(location.search);
  // Variáveis do roteiro. Na reunião vêm do CRM; aqui, o nome pode vir pelo link (?consultor=Nome).
  const variaveis = { consultor: params.get('consultor') || 'Nome do Consultor' };

  let roteiro = null;
  let atual = 0;
  let etapa = 0;
  let aba = 'dicas';
  let notasAbertas = true;

  const $ = (id) => document.getElementById(id);
  const palco = $('palco'), canvas = $('canvas');

  const substituir = (txt, vars) => typeof txt !== 'string' ? '' : txt.replace(/\{\{(\w+)\}\}/g, (_, k) => vars[k] ?? '');
  const escapar = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const varsEscapadas = () => Object.fromEntries(Object.entries(variaveis).map(([k, v]) => [k, escapar(v ?? '')]));
  const ehImagem = (valor, nome) => /^https?:\/\//i.test(valor) && (/\.(jpe?g|png|webp|gif|svg|avif)(\?|#|$)/i.test(valor) || /foto|avatar|imagem|image|photo/i.test(nome || ''));

  function css(el, estilos) { for (const [k, v] of Object.entries(estilos)) if (v !== undefined && v !== null) el.style[k] = v; return el; }
  function px(v) { return typeof v === 'number' ? v + 'px' : v; }

  // Mesmo resultado do resolverBloco do CRM: variável vira texto (ou imagem), {{ }} resolvidos.
  function resolver(b) {
    const c = { ...b, props: { ...b.props } };
    const p = c.props;
    if (b.tipo === 'text') {
      p.texto = substituir(p.texto, variaveis);
      if (p.html) p.html = substituir(p.html, varsEscapadas());
      if (p.href && p.href.includes('{{')) {
        const falta = [...p.href.matchAll(/\{\{(\w+)\}\}/g)].some(([, k]) => !variaveis[k]);
        p.href = falta ? undefined : substituir(p.href, variaveis);
      }
    }
    if (b.tipo === 'variable') {
      const valor = variaveis[p.variavel];
      if (valor && ehImagem(valor, p.variavel)) return { ...c, tipo: 'image', props: { url: valor, objectFit: 'cover', borderRadius: b.borderRadius ?? 0 } };
      if (valor) return { ...c, tipo: 'text', props: { texto: valor, fontSize: p.fontSize, fontWeight: p.fontWeight, fontFamily: p.fontFamily, color: p.color, textAlign: p.textAlign, textTransform: p.textTransform } };
    }
    if (b.tipo === 'list' && p.items) p.items = p.items.map((i) => substituir(i, variaveis));
    if (b.tipo === 'image' && p.url) p.url = substituir(p.url, variaveis);
    return c;
  }

  function visivel(b) {
    const cond = b.visibilidade;
    if (cond && cond.variavel && !variaveis[cond.variavel]) return false;
    return true;
  }

  function conteudo(b, miniatura) {
    const p = b.props;
    if (b.tipo === 'text') {
      const caixa = css(document.createElement('div'), {
        width: '100%', height: '100%', display: 'flex', flexDirection: 'column',
        justifyContent: p.verticalAlign ?? 'flex-start', fontSize: px(p.fontSize ?? 24),
        fontWeight: p.fontWeight ?? 'normal', fontFamily: p.fontFamily ?? 'inherit',
        color: p.color ?? '#ffffff', textAlign: p.textAlign ?? 'left',
        textAlignLast: p.textAlign === 'justify' ? 'justify' : 'auto',
        lineHeight: p.lineHeight ?? 1.2, letterSpacing: px(p.letterSpacing ?? 0),
        textTransform: p.textTransform ?? 'none', fontStyle: p.italic ? 'italic' : 'normal',
        overflow: 'hidden', whiteSpace: 'pre-wrap', wordBreak: 'break-word',
      });
      const interno = css(document.createElement('div'), { width: '100%' });
      if (p.html) interno.innerHTML = p.html; else interno.textContent = p.texto ?? '';
      if (p.href && !miniatura) {
        const a = document.createElement('a');
        a.href = p.href; a.target = p.hrefTarget ?? '_blank'; a.rel = 'noopener noreferrer';
        css(a, { color: 'inherit', textDecoration: p.html ? 'none' : 'underline', width: '100%', display: 'block' });
        a.appendChild(interno);
        caixa.appendChild(a);
      } else caixa.appendChild(interno);
      return caixa;
    }
    if (b.tipo === 'image') {
      const ox = p.contentX ?? 50, oy = p.contentY ?? 50, escala = p.contentScale ?? 1;
      const caixa = css(document.createElement('div'), { position: 'relative', width: '100%', height: '100%', overflow: 'hidden', borderRadius: px(p.borderRadius ?? 0) });
      if (!p.url) return caixa;
      const img = document.createElement('img');
      img.alt = ''; img.decoding = 'async'; if (miniatura) img.loading = 'lazy';
      img.src = p.url;
      img.onerror = () => { img.style.visibility = 'hidden'; };
      css(img, {
        width: '100%', height: '100%', objectFit: p.objectFit ?? 'cover', objectPosition: `${ox}% ${oy}%`,
        opacity: p.opacity ?? 1, transform: escala !== 1 ? `scale(${escala})` : undefined, transformOrigin: `${ox}% ${oy}%`,
        display: 'block', pointerEvents: 'none',
      });
      caixa.appendChild(img);
      return caixa;
    }
    if (b.tipo === 'shape') {
      return css(document.createElement('div'), {
        width: '100%', height: '100%', background: p.background ?? 'transparent',
        borderRadius: p.shape === 'circle' ? '50%' : p.shape === 'rounded-rect' ? '16px' : '0',
        borderWidth: px(p.borderWidth ?? 0), borderColor: p.borderColor ?? 'transparent',
        borderStyle: (p.borderWidth ?? 0) > 0 ? 'solid' : 'none',
      });
    }
    if (b.tipo === 'list') {
      const caixa = css(document.createElement('div'), {
        width: '100%', height: '100%', display: 'flex', flexDirection: 'column', gap: px(p.lineSpacing ?? 8),
        fontSize: px(p.fontSize ?? 16), color: p.color ?? '#ffffff', fontWeight: p.fontWeight ?? 'normal',
        fontFamily: p.fontFamily ?? 'inherit', overflow: 'hidden',
      });
      (p.items ?? []).forEach((item, i) => {
        const linha = css(document.createElement('div'), { display: 'flex', alignItems: 'baseline' });
        const estilo = p.bulletStyle ?? 'dot';
        const marca = { dot: '●', diamond: '◆', number: `${i + 1}.`, check: '✓' }[estilo];
        if (marca) {
          const s = css(document.createElement('span'), { marginRight: '8px', color: estilo === 'diamond' || estilo === 'check' ? '#c8a43a' : undefined });
          s.textContent = marca; linha.appendChild(s);
        }
        const t = document.createElement('span'); t.textContent = item; linha.appendChild(t);
        caixa.appendChild(linha);
      });
      return caixa;
    }
    if (b.tipo === 'video') {
      const caixa = css(document.createElement('div'), { position: 'relative', width: '100%', height: '100%', overflow: 'hidden', borderRadius: px(p.borderRadius ?? 0), background: '#000' });
      if (miniatura) {
        if (p.posterUrl) {
          const img = document.createElement('img'); img.src = p.posterUrl; img.loading = 'lazy'; img.alt = '';
          css(img, { width: '100%', height: '100%', objectFit: p.objectFit ?? 'cover' });
          caixa.appendChild(img);
        }
        return caixa;
      }
      // Como no CRM: o vídeo nunca começa sozinho — quem apresenta dá o play.
      const v = document.createElement('video');
      v.src = p.url; v.preload = 'metadata'; v.playsInline = true; v.loop = !!p.loop;
      if (p.posterUrl) v.poster = p.posterUrl;
      css(v, { width: '100%', height: '100%', objectFit: p.objectFit ?? 'cover', display: 'block' });
      const bt = document.createElement('button');
      bt.className = 'rodar';
      bt.innerHTML = '<span>▶ RODAR VÍDEO</span>';
      bt.onclick = (e) => { e.stopPropagation(); bt.remove(); v.controls = true; v.muted = false; v.play().catch(() => {}); };
      caixa.append(v, bt);
      return caixa;
    }
    return null;
  }

  function desenharSlide(destino, slide, passo, miniatura) {
    destino.replaceChildren();
    css(destino, { background: slide.background ?? '#0a0a0a' });
    if (slide.background_image_url) {
      const bg = document.createElement('img');
      bg.src = slide.background_image_url; bg.alt = '';
      css(bg, { position: 'absolute', inset: '0', width: '100%', height: '100%', objectFit: 'cover', opacity: slide.background_opacity ?? 1 });
      destino.appendChild(bg);
    }
    slide.blocos
      .filter(visivel)
      .map(resolver)
      .filter((b) => {
        if (b.tipo === 'variable') return false;
        const p = b.props;
        if (b.tipo === 'text' && p.texto !== undefined && !p.html && p.texto.trim() === '') return false;
        if (b.tipo === 'list' && p.items && p.items.every((i) => !i.trim())) return false;
        return true;
      })
      .sort((a, c) => (a.zIndex ?? 0) - (c.zIndex ?? 0))
      .forEach((b) => {
        const el = conteudo(b, miniatura);
        if (!el) return;
        const caixa = document.createElement('div');
        caixa.className = 'bloco';
        const step = b.revealStep;
        if (!miniatura && step != null && step !== 0) {
          caixa.dataset.etapa = step;
          if (passo < step) caixa.classList.add('oculto');
        }
        css(caixa, { left: px(b.x), top: px(b.y), width: px(b.w), height: px(b.h), zIndex: b.zIndex ?? 1 });
        // Estilos-base do bloco (opacidade, borda, canto), como o getBaseStyles do CRM
        const base = css(document.createElement('div'), {
          width: '100%', height: '100%', position: 'relative', opacity: b.opacity ?? 1,
          transform: (b.rotation ?? 0) !== 0 ? `rotate(${b.rotation}deg)` : undefined,
          borderRadius: px(b.borderRadius ?? 0), borderWidth: px(b.borderWidth ?? 0),
          borderColor: b.borderColor ?? 'transparent', borderStyle: (b.borderWidth ?? 0) > 0 ? 'solid' : 'none',
        });
        base.appendChild(el);
        caixa.appendChild(base);
        destino.appendChild(caixa);
      });
  }

  const maxEtapa = (slide) => slide.blocos.reduce((m, b) => (b.revealStep != null && b.revealStep > m ? b.revealStep : m), 0);

  function ajustarEscala() {
    const r = palco.getBoundingClientRect();
    const s = Math.min(r.width / W, r.height / H);
    canvas.style.transform = `translate(-50%, -50%) scale(${s})`;
  }

  function atualizarNotas() {
    document.body.classList.toggle('com-notas', notasAbertas);
    $('bt-dicas').classList.toggle('ativo', notasAbertas && aba === 'dicas');
    $('bt-exemplo').classList.toggle('ativo', notasAbertas && aba === 'exemplo');
    document.querySelectorAll('.notas-aba').forEach((b) => b.classList.toggle('ativo', b.dataset.aba === aba));
    const slide = roteiro.slides[atual];
    const texto = substituir(slide.notas[aba] || '', variaveis).trim();
    const el = $('notas-texto');
    el.classList.toggle('vazio', !texto);
    el.textContent = texto || (aba === 'dicas' ? 'Este slide não tem dicas.' : 'Este slide não tem exemplo.');
    el.scrollTop = 0;
    $('notas-slide').textContent = `Slide ${atual + 1}${slide.label ? ' — ' + slide.label.trim() : ''}`;
    requestAnimationFrame(ajustarEscala);
  }

  function mostrar(indice, passo = 0) {
    atual = Math.max(0, Math.min(roteiro.slides.length - 1, indice));
    etapa = passo;
    const slide = roteiro.slides[atual];
    desenharSlide(canvas, slide, etapa, false);
    const max = maxEtapa(slide);
    $('contador').innerHTML = `<b>${atual + 1}</b> / ${roteiro.slides.length}` + (max > 0 ? ` · etapa ${etapa}/${max}` : '');
    $('nome-slide').textContent = (slide.label || '').trim();
    $('anterior').disabled = atual === 0 && etapa === 0;
    $('proximo').disabled = atual === roteiro.slides.length - 1 && etapa >= max;
    history.replaceState(null, '', `${location.pathname}${location.search}#${atual + 1}`);
    atualizarNotas();
  }

  // Avançar revela a próxima etapa do slide antes de trocar de slide (igual ao player do CRM)
  function proximo() {
    const max = maxEtapa(roteiro.slides[atual]);
    if (etapa < max) {
      etapa += 1;
      mostrarEtapa();
    } else if (atual < roteiro.slides.length - 1) mostrar(atual + 1);
  }
  function anterior() {
    if (etapa > 0) { etapa -= 1; mostrarEtapa(); }
    else if (atual > 0) { const i = atual - 1; mostrar(i, maxEtapa(roteiro.slides[i])); }
  }
  function mostrarEtapa() {
    // Só troca a visibilidade dos blocos: não redesenha (vídeo tocando continua)
    const slide = roteiro.slides[atual];
    canvas.querySelectorAll('.bloco[data-etapa]').forEach((el) => el.classList.toggle('oculto', etapa < Number(el.dataset.etapa)));
    const max = maxEtapa(slide);
    $('contador').innerHTML = `<b>${atual + 1}</b> / ${roteiro.slides.length}` + (max > 0 ? ` · etapa ${etapa}/${max}` : '');
    $('anterior').disabled = atual === 0 && etapa === 0;
    $('proximo').disabled = atual === roteiro.slides.length - 1 && etapa >= max;
  }

  function abrirAba(qual) {
    if (notasAbertas && aba === qual) notasAbertas = false;
    else { notasAbertas = true; aba = qual; }
    atualizarNotas();
  }

  function abrirGrade() {
    const lista = $('grade-lista');
    if (!lista.childElementCount) {
      roteiro.slides.forEach((s, i) => {
        const bt = document.createElement('button');
        bt.className = 'miniatura';
        const quadro = document.createElement('div'); quadro.className = 'quadro';
        const tela = css(document.createElement('div'), {});
        desenharSlide(tela, s, 99, true);
        quadro.appendChild(tela);
        const leg = document.createElement('span'); leg.className = 'legenda';
        leg.innerHTML = `<b>${i + 1}</b>`; leg.append((s.label || '').trim());
        bt.append(quadro, leg);
        bt.onclick = () => { fecharGrade(); mostrar(i); };
        lista.appendChild(bt);
      });
    }
    lista.querySelectorAll('.miniatura').forEach((m, i) => m.classList.toggle('atual', i === atual));
    $('grade').classList.add('aberta');
    requestAnimationFrame(() => {
      lista.querySelectorAll('.quadro').forEach((q) => { q.firstChild.style.transform = `scale(${q.clientWidth / W})`; });
      lista.children[atual]?.scrollIntoView({ block: 'center' });
    });
  }
  function fecharGrade() { $('grade').classList.remove('aberta'); }

  $('proximo').onclick = proximo;
  $('anterior').onclick = anterior;
  $('bt-dicas').onclick = () => abrirAba('dicas');
  $('bt-exemplo').onclick = () => abrirAba('exemplo');
  $('bt-grade').onclick = abrirGrade;
  $('grade-fechar').onclick = fecharGrade;
  $('notas-fechar').onclick = () => { notasAbertas = false; atualizarNotas(); };
  document.querySelectorAll('.notas-aba').forEach((b) => (b.onclick = () => { aba = b.dataset.aba; atualizarNotas(); }));

  document.addEventListener('keydown', (e) => {
    if (!roteiro || e.ctrlKey || e.metaKey || e.altKey) return;
    if ($('grade').classList.contains('aberta')) { if (e.key === 'Escape' || e.key === 'g' || e.key === 'G') fecharGrade(); return; }
    if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); proximo(); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); anterior(); }
    else if (e.key === 'd' || e.key === 'D') abrirAba('dicas');
    else if (e.key === 'e' || e.key === 'E') abrirAba('exemplo');
    else if (e.key === 'g' || e.key === 'G') abrirGrade();
    else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
    else if (e.key === 'Escape' && notasAbertas) { notasAbertas = false; atualizarNotas(); }
    else if (e.key === 'Home') mostrar(0);
    else if (e.key === 'End') mostrar(roteiro.slides.length - 1);
  });

  // Toque: arrastar para o lado troca de slide
  let toqueX = null, toqueY = null;
  palco.addEventListener('touchstart', (e) => { toqueX = e.touches[0].clientX; toqueY = e.touches[0].clientY; }, { passive: true });
  palco.addEventListener('touchend', (e) => {
    if (toqueX == null) return;
    const dx = e.changedTouches[0].clientX - toqueX, dy = e.changedTouches[0].clientY - toqueY;
    toqueX = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) (dx < 0 ? proximo : anterior)();
  });

  // Link direto para um slide: …/#12
  window.addEventListener('hashchange', () => {
    const n = parseInt(location.hash.slice(1), 10);
    if (roteiro && Number.isFinite(n) && n - 1 !== atual) mostrar(n - 1);
  });

  new ResizeObserver(ajustarEscala).observe(palco);

  fetch('dados/roteiro.json', { cache: 'no-cache' })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((dados) => {
      roteiro = dados;
      document.title = dados.nome;
      $('titulo').textContent = dados.nome;
      $('carregando').remove();
      const inicial = parseInt(location.hash.slice(1), 10);
      mostrar(Number.isFinite(inicial) ? inicial - 1 : 0);
    })
    .catch(() => { $('carregando').textContent = 'NÃO FOI POSSÍVEL CARREGAR O ROTEIRO'; });
})();
</script>
</body>
</html>
